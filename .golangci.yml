version: "2"

run:
  build-tags:
    - e2e

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - misspell
    - nolintlint
    - unconvert
  settings:
    forbidigo:
      forbid:
        - pattern: 'proc\.Start\b'
          msg: start agent processes with backend.StartAgent
  exclusions:
    rules:
      - path: internal/backend/agent\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nozomi-koborinai/cursor-local-bridge
