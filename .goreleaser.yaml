version: 2

project_name: clb

builds:
  - main: ./cmd/clb
    binary: clb
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - packaging/launchd/*.plist

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  prerelease: auto

homebrew_casks:
  - name: clb
    binaries: [clb]
    homepage: https://github.com/nozomi-koborinai/cursor-local-bridge
    description: Run local Cursor CLI agents with a cloud-agent-shaped lifecycle
    license: MIT
    repository:
      owner: nozomi-koborinai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    # The binary is not signed or notarized.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "clb"], chdir: "."
          end
